name: 自動投稿コードの検証

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: APIを使わず分岐と秘匿を検証
        run: python -m unittest discover -s tests -v
      - name: 認証不要のdry-run
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: python scripts/post_instagram.py --no 01 --dry-run
