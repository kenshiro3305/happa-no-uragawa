name: トークン延長

on:
  schedule:
    # 毎日 04:10 JST（19:10 UTC）。毎日押し出すので期限切れが起きない
    - cron: '10 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: GH_PAT の有無を確認
        id: guard
        env:
          HAS_PAT: ${{ secrets.GH_PAT != '' }}
        run: |
          echo "has_pat=$HAS_PAT" >> "$GITHUB_OUTPUT"
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::GH_PAT が未設定のため、トークンを自動更新できません。60日後に投稿が止まります。"
          fi

      - name: トークンを延長
        if: steps.guard.outputs.has_pat == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/refresh_token.py --out new_token.txt

      - name: Secrets に書き戻す
        if: steps.guard.outputs.has_pat == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        # 標準出力に出さず、ファイルから直接読ませる
        run: gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" < new_token.txt

      - name: 後片付け
        if: always()
        run: rm -f new_token.txt

      - name: 失敗したらIssueで知らせる
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[要対応] Instagramトークンの延長に失敗しました';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const body = [
              'アクセストークンの自動延長に失敗しました。',
              '**放置すると60日以内に投稿が止まります。**',
              '',
              `実行ログ: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              '',
              'すでに失効している場合、延長はできません。',
              'Meta for Developers の「API setup with Instagram login」から取り直してください。',
            ].join('\n');
            const found = open.data.find((i) => i.title === title);
            if (found) {
              await github.rest.issues.createComment({ owner, repo, issue_number: found.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
