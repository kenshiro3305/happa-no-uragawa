name: トークン延長

on:
  schedule:
    # 毎日 04:10 JST（19:10 UTC）。延長とSecrets保存の成功を確認する
    - cron: '10 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 延長と通知の設定を確認
        id: guard
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python scripts/check_config.py --purpose refresh

      - name: 延長の設定不足をIssueで知らせる
        # 必須設定を登録するまで毎日ここを通る。同じ原因ではコメントを追加せず、
        # 設定不足の種類が変わった場合だけ既存Issueの本文を更新する。
        # 新規作成したときだけ created=true を返し、メールもそのときだけ送る。
        id: notify
        if: failure() && steps.guard.outputs.ready == 'false'
        uses: actions/github-script@v9
        env:
          FAILURE_REASON: ${{ steps.guard.outputs.reason }}
          MISSING: ${{ steps.guard.outputs.missing }}
          MAIL_MISSING: ${{ steps.guard.outputs.mail_missing }}
        with:
          script: |
            const title = (process.env.MISSING || '').includes('GH_PAT')
              ? '[要対応] GH_PAT が未設定のためトークンを延長できません'
              : '[要対応] Instagramトークンの延長に失敗しました';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const body = [
              '必須Secretsが未設定のため、アクセストークンの自動延長ができていません。',
              `今回の原因: ${process.env.FAILURE_REASON}`,
              process.env.MAIL_MISSING ? `メール通知も未設定: ${process.env.MAIL_MISSING}` : '',
              'このワークフローは毎日動いていますが、実際には何もしていません。',
              '',
              '延長できていないため有効期限は更新されません。失効済みのトークンは再取得が必要です。',
              '',
              `実行ログ: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              '',
              '対応:',
              '- Settings → Secrets and variables → Actions に `GH_PAT` を登録する',
              '- 同じrepository secretsに `IG_ACCESS_TOKEN` も登録する',
              '- 必要な権限は、このリポジトリの Secrets への書き込み',
              '- 登録後、Actions からこのワークフローを手動実行して成功を確認する',
            ].join('\n');
            const found = open.data.find((i) => i.title === title);
            if (found) {
              // 設定不足の種類が変わった場合だけ既存Issueの本文を更新する。
              if (!(found.body || '').includes(`今回の原因: ${process.env.FAILURE_REASON}`)) {
                await github.rest.issues.update({ owner, repo, issue_number: found.number, body });
              }
              core.info(`Issue #${found.number} に設定不足を記録した。`);
              core.setOutput('created', 'false');
            } else {
              const made = await github.rest.issues.create({ owner, repo, title, body });
              core.info(`Issue #${made.data.number} を作成した。`);
              core.setOutput('created', 'true');
            }

      - name: 設定不足をGmailで知らせる
        # Issueは記録として残す価値があるので消さない。ただしIssueは開きっぱなしでも
        # 誰も見に来ないので、気づける場所（Gmail）へも同じ内容を流す。
        # メール未設定は設定検査で警告し、この送信はスキップする。設定不足の失敗は維持する。
        # 送るのはIssueを新規作成したときだけ。毎日同じ文面が届くと読まれなくなる。
        if: always() && steps.notify.outputs.created == 'true' && steps.guard.outputs.mail_ready == 'true'
        env:
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILURE_REASON: ${{ steps.guard.outputs.reason }}
        run: |
          cat > alert.txt <<EOF
          必須Secretsが未設定のため、アクセストークンの自動延長ができていません。
          原因: $FAILURE_REASON
          このワークフローは毎日動いていますが、実際には何もしていません。

          延長できていないため有効期限は更新されません。失効済みの場合は再取得が必要です。

          実行ログ: $RUN_URL

          対応:
          - Settings → Secrets and variables → Actions に GH_PAT を登録する
          - 必要な権限は、このリポジトリの Secrets への書き込み
          - 登録後、Actions からこのワークフローを手動実行して成功を確認する
          EOF
          python scripts/send_alert_mail.py \
            --subject "[葉っぱの裏側] 設定不足でトークンを延長できません" \
            --body-file alert.txt

      - name: トークンを延長
        id: refresh
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/refresh_token.py --out new_token.txt

      - name: Secrets に書き戻す
        id: save
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        # 標準出力に出さず、ファイルから直接読ませる
        run: gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" < new_token.txt

      - name: 後片付け
        if: always()
        run: rm -f new_token.txt

      - name: 失敗原因を実行結果に残す
        id: diagnosis
        if: failure()
        env:
          CONFIG_REASON: ${{ steps.guard.outputs.reason }}
          GUARD_RESULT: ${{ steps.guard.outcome }}
          SAVE_RESULT: ${{ steps.save.outcome }}
        run: |
          if [ "$GUARD_RESULT" = "failure" ]; then
            reason="${CONFIG_REASON:-設定確認ステップに失敗しました。ログを確認してください。}"
          elif [ "$SAVE_RESULT" = "failure" ]; then
            reason="延長後のSecrets保存に失敗しました。GH_PATの対象リポジトリとSecrets書き込み権限を確認してください。"
          else
            reason="延長処理に失敗しました。延長ステップのエラーを確認してください。"
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          printf '\n## 失敗原因\n\n%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"

      - name: 失敗したらIssueで知らせる
        # 必須設定不足では上でIssueに記録しているので、ここでは二重に立てない
        if: failure() && steps.guard.outputs.ready != 'false'
        uses: actions/github-script@v9
        env:
          FAILURE_REASON: ${{ steps.diagnosis.outputs.reason }}
        with:
          script: |
            const title = '[要対応] Instagramトークンの延長に失敗しました';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const body = [
              'アクセストークンの自動延長に失敗しました。',
              `原因: ${process.env.FAILURE_REASON || '設定確認前に失敗しました。実行ログを確認してください。'}`,
              '有効期限の更新は未確認です。失効済みの場合は再取得が必要です。',
              '',
              `実行ログ: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              '',
              'すでに失効している場合、延長はできません。',
              'Meta for Developers の「API setup with Instagram login」から取り直してください。',
            ].join('\n');
            const found = open.data.find((i) => i.title === title);
            if (found) {
              await github.rest.issues.createComment({ owner, repo, issue_number: found.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: 失敗をGmailで知らせる
        # Issueは記録として残す。必須設定不足のメールは上の分岐だけで送る。
        # メール設定がない場合は設定検査で警告し、送信処理の二次障害を避ける。
        if: failure() && steps.guard.outputs.ready == 'true' && steps.guard.outputs.mail_ready == 'true'
        env:
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILURE_REASON: ${{ steps.diagnosis.outputs.reason }}
        run: |
          cat > alert.txt <<EOF
          アクセストークンの自動延長に失敗しました。
          原因: $FAILURE_REASON
          有効期限の更新は未確認です。失効済みの場合は再取得が必要です。

          実行ログ: $RUN_URL

          すでに失効している場合、延長はできません。
          Meta for Developers の「API setup with Instagram login」から取り直してください。
          EOF
          python scripts/send_alert_mail.py \
            --subject "[葉っぱの裏側] Instagramトークンの延長に失敗しました" \
            --body-file alert.txt
